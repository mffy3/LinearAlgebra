name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Math tests
        run: node tests/math.test.js

      - name: Question bank tests
        run: node tests/questions.test.js

      - name: API tests
        run: node tests/api.test.js
