name: publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'mffy3/LinearAlgebra'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the tagged archive
        run: |
          git archive --format=zip --prefix="LinearAlgebra-${TAG}/" "$TAG" -o "LinearAlgebra-${TAG}.zip"
          sha256sum "LinearAlgebra-${TAG}.zip" > SHA256SUMS.txt

      - name: Create the GitHub Release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leave it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            "LinearAlgebra-${TAG}.zip" \
            SHA256SUMS.txt \
            --title "Linear Algebra $TAG" \
            --notes-file RELEASE_NOTES.md
